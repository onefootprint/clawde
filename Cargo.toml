[package]
name = "clawde"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Clawde: a Rust port of the Claude Agent SDK — programmatic access to the Claude Code CLI"
license = "MIT"
repository = "https://github.com/onefootprint/clawde"
documentation = "https://docs.rs/clawde"
readme = "README.md"
keywords = ["claude", "anthropic", "agent", "sdk", "ai"]
categories = ["api-bindings", "asynchronous", "development-tools"]
exclude = [".github/"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
futures = "0.3"
itertools = "0.14"
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
which = "8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
